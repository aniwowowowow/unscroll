<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unscroll - Upload (2/3)</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
        .box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; max-width: 90vw; }
        h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
        .step { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
        input[type="file"] { width: 100%; margin-bottom: 1rem; }
        button { width: 100%; padding: 0.6rem; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="step">Step 2 of 3</div>
        <h1>Upload your top-apps breakdown screenshot</h1>
        <form method="post" action="/upload/step2" enctype="multipart/form-data">
            <input type="file" name="screenshot" accept="image/*" required>
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
